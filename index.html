<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starium Rafa ERP</title>
    <link rel="icon" type="image/svg+xml" href="/rafa-logo.svg" />
    <meta name="theme-color" content="#121212" />
    <style>
      /* ============================================================
         STARIUM RAFA — INSTANT LOADING SCREEN
         Seamless with app background (#121212).
         Large, clear, beautiful — easy on the eyes.
         Pure HTML/CSS/JS — shows BEFORE any JS loads.
         ============================================================ */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      
      :root {
        --bg: #121212;
        --fg: #F0F0F0;
        --muted: #A0A0A0;
        --accent: #00BCD4;
        --card: #1E1E1E;
        --border: #333333;
      }
      
      html, body {
        height: 100%;
        width: 100%;
        overflow: hidden;
        background: var(--bg);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      /* Loading Screen — fills viewport, matches app background exactly */
      #loading-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      }
      
      #loading-screen.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      
      /* Centered Content — Generous spacing */
      .loading-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 48px;
        text-align: center;
        padding: 48px;
      }
      
      /* App Name — Large, Clear Typography */
      .app-name {
        font-size: clamp(36px, 6vw, 56px);
        font-weight: 800;
        letter-spacing: -0.02em;
        color: var(--fg);
        line-height: 1.15;
      }
      
      .app-tagline {
        font-size: clamp(16px, 2.5vw, 22px);
        font-weight: 500;
        color: var(--muted);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-top: 8px;
      }
      
      /* Status Pill — Large, Clear */
      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 16px;
        padding: 16px 36px;
        border-radius: 100px;
        background: #1E1E1E;
        border: 1px solid var(--border);
        font-family: 'SF Mono', 'Fira Code', 'Monaco', monospace;
        font-size: clamp(15px, 2vw, 20px);
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--fg);
        white-space: nowrap;
      }
      
      .status-indicator {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #00BCD4;
        animation: pulse 1.4s ease-in-out infinite;
        box-shadow: 0 0 20px #00BCD4, 0 0 40px rgba(0, 188, 212, 0.3);
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 0.55; transform: scale(0.95); }
        50% { opacity: 1; transform: scale(1.15); }
      }
      
      .status-text {
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }
      
      .status-dots {
        display: inline-flex;
        gap: 6px;
      }
      
      .status-dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--muted);
        animation: dotBounce 1.6s ease-in-out infinite both;
      }
      
      .status-dots span:nth-child(1) { animation-delay: 0s; }
      .status-dots span:nth-child(2) { animation-delay: 0.2s; }
      .status-dots span:nth-child(3) { animation-delay: 0.4s; }
      
      @keyframes dotBounce {
        0%, 80%, 100% { transform: scale(0.6); opacity: 0.25; }
        40% { transform: scale(1.3); opacity: 1; background: #00BCD4; }
      }
      
      /* Progress Bar — Thick, Clear */
      .progress-wrapper {
        width: 100%;
        max-width: 420px;
        height: 6px;
        background: #1A1A1A;
        border-radius: 100px;
        overflow: hidden;
        margin-top: 32px;
        box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.4);
      }
      
      .progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #00BCD4, #10B981);
        border-radius: 100px;
        transition: width 0.4s ease-out;
        transform-origin: left center;
      }
      
      /* Subtle Ambient Glow — Very Subtle */
      .ambient-glow {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: 
          radial-gradient(ellipse 55% 35% at 50% -5%, rgba(0, 188, 212, 0.025), transparent 55%),
          radial-gradient(ellipse 45% 25% at 85% 105%, rgba(16, 185, 129, 0.015), transparent 45%);
        opacity: 1;
      }
      
      /* Subtitle — Larger, Clearer */
      .subtitle {
        font-size: clamp(14px, 2vw, 18px);
        color: var(--muted);
        font-weight: 400;
        letter-spacing: 0.04em;
        margin-top: 24px;
        opacity: 0.7;
        line-height: 1.5;
      }
      
      /* Reduced Motion */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
      
      /* Responsive — Scales beautifully at all sizes */
      @media (max-width: 768px) {
        .loading-content { gap: 40px; padding: 36px; }
        .status-pill { padding: 14px 28px; }
        .progress-wrapper { max-width: 340px; }
      }
      
      @media (max-width: 480px) {
        .loading-content { gap: 36px; padding: 28px; }
        .status-pill { padding: 12px 24px; }
        .progress-wrapper { max-width: 280px; height: 5px; }
      }
      
      </style>
  </head>
  <body>
    <!-- ============================================================
         INSTANT LOADING SCREEN — Seamless with app background
         ============================================================ -->
    <div id="loading-screen" role="status" aria-label="Loading Starium Rafa ERP">
      <div class="ambient-glow" aria-hidden="true"></div>
      
      <div class="loading-content">
        <!-- App Name -->
        <div class="app-name">Starium Rafa</div>
        <div class="app-tagline">Enterprise Factory ERP</div>
        
        <!-- Status Pill -->
        <div class="status-pill" id="status-pill">
          <span class="status-indicator" aria-hidden="true"></span>
          <span class="status-text" id="status-text">
            Processing
            <span class="status-dots" aria-hidden="true">
              <span></span><span></span><span></span>
            </span>
          </span>
        </div>
        
        <!-- Progress Bar -->
        <div class="progress-wrapper" aria-hidden="true">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
        
        <!-- Subtitle -->
        <p class="subtitle" id="subtitle">Initializing factory intelligence...</p>
      </div>
    </div>
    
    <!-- React App Root -->
    <div id="root"></div>
    
    <script>
      // ============================================================
      // LOADING SCREEN CONTROLLER
      // Seamless handoff to React app
      // ============================================================
      (function() {
        'use strict';
        
        const loadingScreen = document.getElementById('loading-screen');
        const statusText = document.getElementById('status-text');
        const progressBar = document.getElementById('progress-bar');
        const subtitle = document.getElementById('subtitle');
        const statusPill = document.getElementById('status-pill');
        
        // Status messages that cycle
        const statuses = [
          { text: 'Processing', subtitle: 'Initializing factory intelligence...' },
          { text: 'Loading', subtitle: 'Preparing production systems...' },
          { text: 'Connecting', subtitle: 'Linking to live data streams...' },
          { text: 'Ready', subtitle: 'All systems operational' }
        ];
        
        let statusIndex = 0;
        let progress = 0;
        let isComplete = false;
        
        // Cycle status messages
        function cycleStatus() {
          if (!statusText || statusIndex >= statuses.length - 1) return;
          
          statusIndex++;
          const status = statuses[statusIndex];
          
          // Smooth text transition
          statusText.style.opacity = '0';
          statusText.style.transform = 'translateY(-6px)';
          
          setTimeout(() => {
            statusText.innerHTML = status.text + 
              '<span class="status-dots" aria-hidden="true"><span></span><span></span><span></span></span>';
            if (subtitle) subtitle.textContent = status.subtitle;
            
            statusText.style.opacity = '1';
            statusText.style.transform = 'translateY(0)';
          }, 180);
        }
        
        // Animate progress bar smoothly
        function animateProgress() {
          if (!progressBar || isComplete) return;
          
          const increment = Math.random() * 12 + 6;
          progress = Math.min(95, progress + increment);
          progressBar.style.width = progress + '%';
          
          if (progress < 95) {
            setTimeout(animateProgress, 180 + Math.random() * 250);
          }
        }
        
        // Start progress animation
        animateProgress();
        
        // Cycle status every ~2.2 seconds
        const statusInterval = setInterval(cycleStatus, 2200);
        
        // Watch for React to mount
        function checkReactReady() {
          const root = document.getElementById('root');
          if (root && root.children.length > 0) {
            // React has rendered — complete the loading sequence
            isComplete = true;
            clearInterval(statusInterval);
            
            // Final state
            if (progressBar) progressBar.style.width = '100%';
            if (statusText) {
              statusText.innerHTML = 'Ready' + 
                '<span class="status-dots" aria-hidden="true"><span></span><span></span><span></span></span>';
            }
            if (subtitle) subtitle.textContent = 'Welcome to Starium Rafa ERP';
            
            // Brief pause at "Ready" then fade out
            setTimeout(() => {
              if (loadingScreen) {
                loadingScreen.classList.add('hidden');
              }
            }, 500);
            
            // Clean up DOM after transition
            setTimeout(() => {
              if (loadingScreen) loadingScreen.remove();
            }, 1000);
          } else {
            requestAnimationFrame(checkReactReady);
          }
        }
        
        // Start checking when DOM is ready
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', () => {
            requestAnimationFrame(checkReactReady);
          });
        } else {
          requestAnimationFrame(checkReactReady);
        }
        
        // Fallback: force hide after 12 seconds max
        setTimeout(() => {
          if (loadingScreen && !loadingScreen.classList.contains('hidden')) {
            clearInterval(statusInterval);
            loadingScreen.classList.add('hidden');
            setTimeout(() => loadingScreen.remove(), 1000);
          }
        }, 12000);
        
        // Add smooth transition styles for status text
        const style = document.createElement('style');
        style.textContent = `
          #status-text {
            transition: opacity 0.18s ease, transform 0.18s ease;
          }
          #progress-bar {
            transition: width 0.3s ease-out;
          }
        `;
        document.head.appendChild(style);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
