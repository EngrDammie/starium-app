<script type="module">
import * as THREE from 'three';

// ── RENDER SLIDES ──
const container = document.getElementById('slides');
const progress = document.getElementById('progress');

slides.forEach((s,i)=>{
  const div = document.createElement('div');
  div.className = 'slide'+(i===0?' active':'');
  const accent = ACCENTS[s.accent];
  let html = '<div class="slide-inner" style="--accent:'+accent+'">';
  if(i===0) html += '<img src="rafa-logo.svg" alt="Rafa" style="display:block;margin:0 auto 16px;height:48px;opacity:0.85;filter:brightness(1.2)" />';
  html += '<div class="slide-badge" style="border-color:'+accent+'40;color:'+accent+'">'+s.badge+'</div>';
  html += '<h2>'+s.title+(s.sub?'<span class="hl">'+s.sub+'</span>':'')+'</h2>';
  html += '<p>'+s.text+'</p>';
  if(s.highlight) html += '<div style="margin-top:clamp(12px,2vw,20px);padding:clamp(10px,1.2vw,16px) clamp(14px,2vw,24px);background:rgba(0,230,118,0.06);border-radius:12px;border:1px solid rgba(0,230,118,0.1);display:inline-block;max-width:800px"><span style="color:'+accent+';font-weight:600;font-size:clamp(0.8rem,1.3vw,1.05rem);line-height:1.6">'+s.highlight+'</span></div>';
  if(s.stats){
    html += '<div class="stat-row">';
    s.stats.forEach(st=>{html+='<div class="stat"><div class="num">'+st[0]+'</div><div class="lbl">'+st[1]+'</div></div>'});
    html += '</div>';
  }
  if(s.tags){
    html += '<div class="tag-row">';
    s.tags.forEach(t=>{html+='<div class="tag" style="border-color:'+accent+'30;color:'+accent+';background:'+accent+'0a">'+t+'</div>'});
    html += '</div>';
  }
  if(s.cards){
    const cols = s.cards.length===4?'grid-2':'grid-3';
    html += '<div class="'+cols+'">';
    s.cards.forEach(c=>{html+='<div class="card"><div class="icon">'+c.icon+'</div><strong>'+c.title+'</strong><span>'+c.desc+'</span></div>'});
    html += '</div>';
  }
  if(s.contact){
    html += '<div class="contact-row">';
    html += '<a href="https://wa.me/2347053331253" target="_blank" class="pill" style="background:linear-gradient(135deg,#00E676,#00BCD4);color:#000">💬 Hire the Architect — WhatsApp Dammie</a>';
    html += '<a href="tel:+2347053331253" style="color:#fff;border:1px solid rgba(255,255,255,0.2)">📞 Call +234 705 333 1253</a>';

  }
  if(s.final && !s.contact) html += '<div style="margin-top:20px;color:rgba(255,255,255,0.2);font-size:clamp(10px,0.8vw,11px);font-family:\'JetBrains Mono\',monospace;letter-spacing:0.5px">'+s.final+'</div>';

const counter = document.createElement('span');
counter.id = 'counter';
counter.textContent = '1 / '+slides.length;
progress.appendChild(counter);

// ── SLIDE CONTROL ──
let current = 0;
let autoTimer = null;
let paused = false;
const AUTO_DELAY = 9000;
const pauseIndicator = document.getElementById('pause-indicator');

function goTo(idx){
  if(idx===current) return;
  document.querySelectorAll('.slide')[current].classList.remove('active');
  document.querySelectorAll('.dot')[current].classList.remove('active');
  document.querySelectorAll('.dot')[idx].classList.remove('passed');
  current = idx;
  document.querySelectorAll('.slide')[current].classList.add('active');
  document.querySelectorAll('.dot').forEach((d,i)=>{
    d.classList.toggle('active',i===current);
    d.classList.toggle('passed',i<current);
  });
  counter.textContent = (current+1)+' / '+slides.length;
  resetTimer();
}

function nextSlide(){if(current<slides.length-1) goTo(current+1);else{paused=true;pauseIndicator.classList.add('show')}}
function prevSlide(){if(current>0) goTo(current-1)}

function resetTimer(){
  if(autoTimer) clearInterval(autoTimer);
  if(!paused) autoTimer = setInterval(nextSlide,AUTO_DELAY);
}

function togglePause(){
  paused = !paused;
  pauseIndicator.classList.toggle('show',paused);
  if(paused){if(autoTimer) clearInterval(autoTimer);autoTimer=null}
  else resetTimer();
}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' ') {e.preventDefault();nextSlide()}
  if(e.key==='ArrowLeft'||e.key==='ArrowUp') {e.preventDefault();prevSlide()}
  if(e.key==='p'||e.key==='P') togglePause();
});

let touchStartX=0,touchStartY=0;
document.addEventListener('touchstart',e=>{
  const t = e.touches[0];
  touchStartX = t.clientX;
  touchStartY = t.clientY;
},{passive:true});
document.addEventListener('touchend',e=>{
  const dx = (e.changedTouches[0]?.clientX||0) - touchStartX;
  const dy = (e.changedTouches[0]?.clientY||0) - touchStartY;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){dx>0?prevSlide():nextSlide()}
  else if(Math.abs(dy)>80&&Math.abs(dy)>Math.abs(dx)*1.5){dy>0?prevSlide():nextSlide()}
},{passive:true});
document.addEventListener('click',e=>{
  if(e.target.closest('.slide-inner')&&!e.target.closest('a')) togglePause();
});

// ── THREE.JS FACTORY SCENE ──

camera.position.set(0,18,42);
camera.lookAt(0,0,0);
const renderer = new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});
renderer.setSize(w,h);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
canvas.appendChild(renderer.domElement);

// Lights
const ambient = new THREE.AmbientLight(0x112244,0.4);
scene.add(ambient);
const dir = new THREE.DirectionalLight(0xffffff,1.2);
dir.position.set(10,30,20);
scene.add(dir);
const fill = new THREE.DirectionalLight(0x00BCD4,0.3);
fill.position.set(-15,10,-10);
scene.add(fill);
const rim = new THREE.DirectionalLight(0x00E676,0.2);
rim.position.set(0,-20,10);
scene.add(rim);

// Ground
const groundGeo = new THREE.PlaneGeometry(120,120);
const groundMat = new THREE.MeshStandardMaterial({
  color:0x080810,
  roughness:0.9,
  metalness:0.1,
  transparent:true,
  opacity:0.6
});
const ground = new THREE.Mesh(groundGeo,groundMat);
ground.rotation.x = -Math.PI/2;
ground.position.y = -2;
scene.add(ground);

// Grid
const grid = new THREE.GridHelper(80,40,0x00BCD4,0x00E676);
grid.position.y = -1.9;
grid.material.transparent = true;
grid.material.opacity = 0.15;
scene.add(grid);

// ── FACTORY BUILDINGS ──
const buildings = [];

function createBuilding(x,z,w,d,h,color,emissiveIntensity=0.08){
  const geo = new THREE.BoxGeometry(w,h,d);
  const mat = new THREE.MeshStandardMaterial({
    color,roughness:0.6,metalness:0.3,
    emissive:color,emissiveIntensity,
    transparent:true,opacity:0.7
  });
  const mesh = new THREE.Mesh(geo,mat);
  mesh.position.set(x,h/2-2,z);
  scene.add(mesh);
  // Edge glow
  const edges = new THREE.EdgesGeometry(geo);
  const edgeMat = new THREE.LineBasicMaterial({color,transparent:true,opacity:0.12});
  const line = new THREE.LineSegments(edges,edgeMat);
  line.position.copy(mesh.position);
  scene.add(line);
  buildings.push({mesh,line,baseY:h/2-2});
  return mesh;
}

// Factory layout - rows of buildings
const layout = [
  [-16,-10,5,5,6,COLORS.cyan],
  [-6,-10,5,5,5,COLORS.cyan],
  [4,-10,5,5,7,COLORS.cyan],
  [14,-10,5,5,5,COLORS.cyan],
  [-16,4,5,5,7,COLORS.green],
  [-6,4,5,5,5,COLORS.green],
  [4,4,5,5,6,COLORS.green],
  [14,4,5,5,5,COLORS.green],
  [-16,-2,8,3,4,COLORS.purple],
  [12,-2,8,3,4,COLORS.purple],
];
layout.forEach(([x,z,w,d,h,c])=>createBuilding(x,z,w,d,h,c));

// Silo towers
[-16,0,16].forEach((x,i)=>{
  const geo = new THREE.CylinderGeometry(1.8,2.2,8,12);
  const mat = new THREE.MeshStandardMaterial({color:COLORS.cyan,roughness:0.5,metalness:0.4,emissive:COLORS.cyan,emissiveIntensity:0.06,transparent:true,opacity:0.5});
  const m = new THREE.Mesh(geo,mat);
  m.position.set(x,2,-18+i*7);
  scene.add(m);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(2.2,0.08,8,16),new THREE.MeshStandardMaterial({color:COLORS.cyan,emissive:COLORS.cyan,emissiveIntensity:0.2,transparent:true,opacity:0.4}));
  ring.position.set(x,5.8,-18+i*7);
  ring.rotation.x=Math.PI/2;
  scene.add(ring);
});

// Conveyor belts
function createConveyor(x,z,length){
  const beltGeo = new THREE.BoxGeometry(length,0.15,0.8);
  const beltMat = new THREE.MeshStandardMaterial({color:0x222233,roughness:0.8,metalness:0.2});
  const belt = new THREE.Mesh(beltGeo,beltMat);
  belt.position.set(x,-1.6,z);
  scene.add(belt);
  // Segments
  for(let i=-length/2+0.5; i<length/2; i+=0.8){
    const seg = new THREE.Mesh(
      new THREE.BoxGeometry(0.05,0.08,0.6),
      new THREE.MeshStandardMaterial({color:0x00BCD4,emissive:0x00BCD4,emissiveIntensity:0.15,transparent:true,opacity:0.3})
    );
    seg.position.set(x+i,-1.5,z);
    scene.add(seg);
  }
}
createConveyor(-10,-8,12);
createConveyor(6,-8,12);
createConveyor(-10,0,12);
createConveyor(6,0,12);

// Floating hexagons
const hexColors = [0x00E676,0x00BCD4,0x7C4DFF,0xFF9800];
const hexes = [];
for(let i=0;i<30;i++){
  const size = 0.3+Math.random()*0.8;
  const geo = new THREE.CylinderGeometry(size,size,size*0.15,6);
  const col = hexColors[i%hexColors.length];
  const mat = new THREE.MeshStandardMaterial({
    color:col,emissive:col,emissiveIntensity:0.2,
    transparent:true,opacity:0.15+Math.random()*0.15,
    roughness:0.3,metalness:0.5
  });
  const m = new THREE.Mesh(geo,mat);
  const angle = Math.random()*Math.PI*2;
  const rad = 12+Math.random()*20;
  m.position.set(Math.cos(angle)*rad,-2+Math.random()*8,Math.sin(angle)*rad);
  m.rotation.x = Math.random()*Math.PI;
  m.rotation.y = Math.random()*Math.PI;
  scene.add(m);
  hexes.push({mesh:m,angle:angle,rad:rad,speed:0.002+Math.random()*0.004,phase:Math.random()*Math.PI*2,rotX:Math.random()*0.005,rotY:Math.random()*0.005,floatA:Math.random()*0.5+0.2,floatF:0.3+Math.random()*0.4});
}

// Particles
const pc = 3000;
const pos = new Float32Array(pc*3);
const cols = new Float32Array(pc*3);
const sizes = new Float32Array(pc);
const pal = [new THREE.Color(0x00E676),new THREE.Color(0x00BCD4),new THREE.Color(0x7C4DFF),new THREE.Color(0x00E676).multiplyScalar(0.5)];
for(let i=0;i<pc;i++){
  const r = 15+Math.random()*45;
  const theta = Math.random()*Math.PI*2;
  const phi = Math.acos(2*Math.random()-1);
  pos[i*3]=r*Math.sin(phi)*Math.cos(theta);
  pos[i*3+1]=r*Math.sin(phi)*Math.sin(theta)-2;
  pos[i*3+2]=r*Math.cos(phi);
  const c = pal[Math.floor(Math.random()*pal.length)];
  cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;
  sizes[i]=0.5+Math.random()*2;
}
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position',new THREE.BufferAttribute(pos,3));
pGeo.setAttribute('color',new THREE.BufferAttribute(cols,3));
pGeo.setAttribute('size',new THREE.BufferAttribute(sizes,1));

const pTex = (()=>{
  const c=document.createElement('canvas');c.width=64;c.height=64;
  const ctx=c.getContext('2d');
  const g=ctx.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(0.15,'rgba(255,255,255,0.8)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(c);
})();

const pMat = new THREE.PointsMaterial({
  size:0.25,map:pTex,blending:THREE.AdditiveBlending,
  depthWrite:false,transparent:true,vertexColors:true,opacity:0.4
});
const particles = new THREE.Points(pGeo,pMat);
scene.add(particles);

// Subtle data-lines on ground
const dataMat = new THREE.LineBasicMaterial({color:0x00E676,transparent:true,opacity:0.02});
for(let i=0;i<15;i++){
  const pts=[];
  const y=-1.85;
  const z=-18+Math.random()*36;
  for(let x=-30;x<=30;x+=1.5) pts.push(new THREE.Vector3(x,y+Math.sin(x*0.2+i*0.7)*0.15,z));
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const line = new THREE.Line(geo,dataMat);
  scene.add(line);
}

// Data nodes floating
const nodeMat = new THREE.MeshStandardMaterial({
  color:0x00E676,emissive:0x00E676,emissiveIntensity:0.3,
  transparent:true,opacity:0.15,roughness:0.2,metalness:0.8
});
const nodes = [];
for(let i=0;i<12;i++){
  const geo = new THREE.OctahedronGeometry(0.2+Math.random()*0.2);
  const m = new THREE.Mesh(geo,nodeMat);
  const a = Math.random()*Math.PI*2;
  const rad = 10+Math.random()*15;
  m.position.set(Math.cos(a)*rad,1+Math.random()*6,Math.sin(a)*rad);
  scene.add(m);
  nodes.push({mesh:m,angle:a,rad:rad,speed:0.001+Math.random()*0.003,phase:Math.random()*Math.PI*2});
}

// Mouse
let mx=0,my=0;
document.addEventListener('mousemove',e=>{mx=(e.clientX/w)*2-1;my=-(e.clientY/h)*2+1});
document.addEventListener('touchmove',e=>{const t=e.touches[0];mx=(t.clientX/w)*2-1;my=-(t.clientY/h)*2+1},{passive:true});
window.addEventListener('resize',()=>{
  const w2=window.innerWidth,h2=window.innerHeight;
  camera.aspect=w2/h2;camera.updateProjectionMatrix();
  renderer.setSize(w2,h2);
});

// ── ANIMATE ──
let clock = new THREE.Clock();
let slideTime = 0;
let targetCamX = 0, targetCamY = 18;

function animate(){
  const t = clock.getElapsedTime();
  slideTime += 0.016;

  // Slow camera orbit
  const orbitAngle = t * 0.04;
  const orbitRadius = 42;
  const baseX = Math.sin(orbitAngle) * orbitRadius * 0.3;
  const baseZ = 42 - Math.abs(Math.sin(orbitAngle)) * 10 + Math.cos(orbitAngle) * 5;

  camera.position.x += ((baseX + mx * 2) - camera.position.x) * 0.008;
  camera.position.y += ((16 + my * 2) - camera.position.y) * 0.008;
  camera.position.z += ((baseZ) - camera.position.z) * 0.008;
  camera.lookAt(0,0,0);

  // Particles
  particles.rotation.y = t * 0.012;
  particles.rotation.x = Math.sin(t * 0.003) * 0.03;

  // Hexes orbit
  hexes.forEach(h=>{
    h.angle += h.speed;
    const yOff = Math.sin(t * h.floatF + h.phase) * h.floatA;
    h.mesh.position.x = Math.cos(h.angle + t*0.001) * h.rad;
    h.mesh.position.z = Math.sin(h.angle + t*0.001) * h.rad;
    h.mesh.position.y = yOff;
    h.mesh.rotation.x += h.rotX;
    h.mesh.rotation.y += h.rotY;
  });

  // Data nodes orbit
  nodes.forEach(n=>{
    n.angle += n.speed;
    n.mesh.position.x = Math.cos(n.angle + t*0.002) * n.rad;
    n.mesh.position.z = Math.sin(n.angle + t*0.002) * n.rad;
    n.mesh.position.y = 6 + Math.sin(t*0.5 + n.phase) * 2;
    n.mesh.rotation.x += 0.01;
    n.mesh.rotation.y += 0.01;
  });

  renderer.render(scene,camera);
  requestAnimationFrame(animate);
}
animate();

// ── START ──
document.getElementById('loading').classList.add('hidden');
setTimeout(()=>{document.getElementById('loading').style.display='none'},1200);
resetTimer();
