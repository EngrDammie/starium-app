# .github/workflows/deploy.yml
name: Deploy to GitHub Pages + Firebase Hosting + Cloudflare Workers

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Permissions for GitHub Pages and Firebase
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

      - name: Build for GitHub Pages (base path = /starium-app/)
        run: npm run build
        env:
          VITE_BASE_PATH: '/starium-app/'

      - name: Rename dist for GitHub Pages
        run: mv dist dist-pages

      - name: Build for Firebase Hosting (base path = /)
        run: npm run build
        env:
          VITE_BASE_PATH: '/'

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist-pages'

      - name: Upload Firebase Hosting artifact
        uses: actions/upload-artifact@v4
        with:
          name: firebase-dist
          path: './dist'
          retention-days: 1

  deploy-github-pages:
    needs: build-and-test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-firebase:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Download Firebase artifact
        uses: actions/download-artifact@v4
        with:
          name: firebase-dist
          path: ./dist

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STARIUM_RAFA_APP }}
          projectId: starium-rafa-app
          channelId: live

  deploy-firestore-rules:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Firestore Rules & Indexes
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STARIUM_RAFA_APP }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/gac.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/gac.json"
          npx --yes firebase-tools@latest deploy \
            --only firestore:rules,firestore:indexes \
            --project starium-rafa-app \
            --non-interactive
          shred -u "$RUNNER_TEMP/gac.json" || rm -f "$RUNNER_TEMP/gac.json"

  deploy-cloudflare-worker:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: email-worker/package-lock.json

      - name: Install Worker dependencies
        run: npm install
        working-directory: email-worker

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: email-worker
          command: deploy